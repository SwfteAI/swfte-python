name: Release

# Tag-based releases require manual approval before any publish runs.
# The publish job is gated by a GitHub Environment named `pypi-publish-prod`
# with required reviewers (configured under Settings → Environments).
# Without that approval, the job pauses indefinitely and nothing reaches PyPI.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to confirm an intentional release'
        required: true

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intentional manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "PUBLISH" ]; then
            echo "::error::Manual run requires confirm=PUBLISH"
            exit 1
          fi
      - run: echo "Release guard passed for ${GITHUB_REF}"

  publish:
    runs-on: ubuntu-latest
    needs: guard
    environment:
      name: pypi-publish-prod
      url: https://pypi.org/project/swfte/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
