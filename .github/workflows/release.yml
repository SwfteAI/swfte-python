name: Release

# ─────────────────────────────────────────────────────────────────────────────
# The publish contract, which is the same one nexus-devtools uses:
#
#   1. A TAG PUSH BUILDS AND VERIFIES. It does not publish. Pushing `v1.2.0`
#      tells you whether that commit is releasable; it does not release it.
#      The previous version of this file published on tag push, with the
#      confirmation guard applying only to manual runs — so `git push --tags`
#      went straight to PyPI with nothing in the way.
#
#   2. PUBLISHING IS A DELIBERATE MANUAL ACT. `workflow_dispatch`, with the
#      publish box ticked AND the exact version typed. A PyPI version cannot be
#      recalled — `yank` hides it but burns the number forever — so ticking a
#      box is too cheap a gesture. Typing 1.1.0 into a run that builds 1.2.0
#      stops before anything is uploaded.
#
#   3. THE VERSION COMES FROM THE SOURCE TREE, never from the tag. Preflight
#      reads pyproject.toml and everything downstream uses that, so a tag that
#      disagrees with the package is a failure rather than a surprise.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish to PyPI"
        type: boolean
        default: false
      confirm_version:
        description: "To publish, type the exact version (e.g. 1.2.0). A mismatch aborts."
        type: string
        default: ""
  push:
    # Build + verify on a release tag. Deliberately does NOT publish.
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve the version from the source tree
        id: version
        run: |
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source tree declares $version"

      - name: A release tag must match the source version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          if [ "$tag" != "$VERSION" ]; then
            echo "::error title=Version drift::tag v$tag, pyproject $VERSION"
            exit 1
          fi
          echo "tag v$tag matches pyproject"

      - name: The version must not already be on PyPI
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A re-used version fails at upload with a confusing 400. Say so here.
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/swfte-sdk/$VERSION/json")
          if [ "$code" = "200" ]; then
            echo "::error title=Already published::swfte-sdk $VERSION exists on PyPI. Bump the version."
            exit 1
          fi
          echo "swfte-sdk $VERSION is not on PyPI (HTTP $code)"

  build:
    name: build
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the artefacts render on PyPI
        # twine check catches a README that PyPI will reject *after* the version
        # number is already burned.
        run: python -m twine check dist/*

      - name: Import the built wheel in a clean environment
        # Building is not the same as installing. A packaging mistake that omits
        # a subpackage builds perfectly and fails on first import.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/python -c "from swfte import SwfteClient; print('import ok')"
          /tmp/verify/bin/python -c "
          from swfte import SwfteClient
          c = SwfteClient(api_key='probe-only')
          assert c.base_url == 'https://api.swfte.com/agents/v2/gateway', c.base_url
          print('shipped default base_url ok:', c.base_url)
          "

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    name: publish
    needs: [preflight, build]
    # All conditions, and only on a manual run from main. A tag push can never
    # reach here, and a dispatch from a scratch branch is refused.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Keep this the environment that carries the required reviewers. The PyPI
    # trusted publisher must be registered with exactly this environment name.
    environment:
      name: pypi-publish-prod
      url: https://pypi.org/project/swfte-sdk/
    permissions:
      # Trusted Publishing (OIDC). No long-lived PyPI token exists or is used.
      id-token: write
    steps:
      - name: Confirm the publish
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          CONFIRM: ${{ inputs.confirm_version }}
        run: |
          if [ "$CONFIRM" != "$VERSION" ]; then
            echo "::error title=Publish not confirmed::typed '$CONFIRM', building '$VERSION'"
            echo "Re-dispatch and type $VERSION into confirm_version to publish."
            exit 1
          fi
          echo "confirmed $VERSION"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  github-release:
    name: github-release
    # Separate from `publish` so the third-party release action never runs in
    # the job that holds the OIDC publishing permission.
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          # Tag the commit that was built, not whatever main is by now.
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
